<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>필라테스 등록·출석 기록</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ef;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{font-size:26px;margin:0 0 6px}.sub{color:#777;margin-bottom:20px}
.card{background:#fff;border:1px solid #e5e0d8;border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 14px}
.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:820px){.form{grid-template-columns:1fr 1fr}}
label{display:block;font-size:12px;color:#777;margin-bottom:5px}
input,button,select{font:inherit}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;background:white}
button{padding:10px 13px;border:0;border-radius:9px;cursor:pointer}
.primary{background:#707c69;color:#fff}.secondary{background:#ecefe9;color:#333}.delete{background:#f7ecec;color:#a44}
.right{text-align:right}.actions{text-align:right;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}}
.metric{background:#eef1eb;border-radius:10px;padding:12px}
.metric span{font-size:12px;color:#777}.metric b{display:block;font-size:18px;margin-top:4px}
.add{display:flex;gap:8px;align-items:end}.add>div{flex:1}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{padding:9px 7px;border-bottom:1px solid #eee;vertical-align:top}th{color:#777;font-size:12px}
.empty{text-align:center;color:#888;padding:22px}
.note{font-size:12px;color:#777;margin-top:10px}
.pass{border:1px solid #e5e0d8;border-radius:12px;padding:14px;margin-top:10px}
.pass-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pass-title{font-weight:700;font-size:16px}.pass-sub{font-size:12px;color:#777;margin-top:4px}
.small-actions{display:flex;gap:6px}.small-actions button{padding:7px 10px;font-size:12px}
.warn{color:#a45b11;font-size:12px;margin-top:8px}
.tag{display:inline-block;background:#eef1eb;padding:4px 8px;border-radius:999px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>필라테스 등록·출석 기록</h1>
<div class="sub">등록차수별로 실제 출석 횟수와 회당 비용을 따로 계산합니다.</div>

<div class="card">
<h2>기기 간 동기화</h2>
<div id="firebaseSetupNotice" class="note" style="display:none;margin-bottom:10px">
Firebase 설정값이 필요합니다.
</div>
<div class="grid" style="grid-template-columns:1fr 1fr">
  <div>
    <div id="authStatus" style="font-weight:700;margin-bottom:4px">로그인 상태 확인 중...</div>
    <div class="note" id="syncStatus">동기화 준비 중</div>
  </div>
  <div class="small-actions" style="justify-content:flex-end">
    <button class="primary" id="loginGoogle">Google 로그인</button>
    <button class="secondary" id="logoutGoogle" style="display:none">로그아웃</button>
  </div>
</div>
<div class="actions" style="text-align:left">
  <button class="secondary" id="migrateLocal">이 브라우저의 기존 데이터 1회 이전</button>
</div>
<div class="note">
로그인 후에는 등록 내역과 출석 기록이 Firebase에 저장되어 휴대폰·PC에서 동일하게 보입니다.
</div>
</div>


<div class="card">
<h2>등록 추가</h2>
<div class="form">
<div><label>등록 이름</label><input id="passName" type="text" placeholder="예: 1차 등록"></div>
<div><label>등록 금액</label><input id="passPrice" type="number" min="0" placeholder="예: 500000"></div>
<div><label>시작일</label><input id="passStart" type="date"></div>
<div><label>종료일</label><input id="passEnd" type="date"></div>
<div><label>주 최대 횟수</label><input id="passWeeklyMax" type="number" min="1" max="7" value="3"></div>
</div>
<div class="actions">
<button class="primary" id="savePassBtn">등록 추가</button>
</div>
<div class="note">등록 기간이 서로 겹치면 출석 추가 시 어느 등록에 넣을지 선택하게 됩니다.</div>
</div>

<div class="grid">
<div class="card">
<h2>출석 추가</h2>
<div class="add">
<div><label>수업 날짜</label><input id="attDate" type="date"></div>
<button class="primary" id="addAttBtn">추가</button>
</div>
<div id="attendanceList"></div>
</div>

<div class="card">
<h2>등록별 이용 현황</h2>
<div id="passList"></div>
</div>
</div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCX2YX01eR060vrONu3xGBjj_OA1qcgM7Y",
  authDomain: "pilates-tracker-6b1b5.firebaseapp.com",
  projectId: "pilates-tracker-6b1b5",
  storageBucket: "pilates-tracker-6b1b5.firebasestorage.app",
  messagingSenderId: "535451534398",
  appId: "1:535451534398:web:f47eb4fe5998bcc2723d6f"
};

var KEY="pilates_multi_pass_v1";
var state={passes:[],attendance:[]};
var editingPassId=null;
var currentUser=null;

function el(id){return document.getElementById(id);}
function uid(){return "p_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);}

function getLocalState(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var obj=JSON.parse(raw);
      return {
        passes:Array.isArray(obj.passes)?obj.passes:[],
        attendance:Array.isArray(obj.attendance)?obj.attendance:[]
      };
    }
  }catch(e){}
  return {passes:[],attendance:[]};
}

function saveLocal(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function todayString(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parseDate(s){
  var p=s.split("-");
  return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
}
function dateString(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function mondayKey(s){
  var d=parseDate(s), day=d.getDay(), offset=(day===0)?-6:1-day;
  d.setDate(d.getDate()+offset);
  return dateString(d);
}
function won(n){
  if(!isFinite(n)||n<=0)return "-";
  return Math.round(n).toLocaleString("ko-KR")+"원";
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

function cloudRef(){
  return doc(db,"users",currentUser.uid,"pilatesTracker","main");
}

async function loadCloud(){
  el("syncStatus").textContent="클라우드 데이터 불러오는 중...";
  var snap=await getDoc(cloudRef());
  if(snap.exists()){
    var data=snap.data();
    state={
      passes:Array.isArray(data.passes)?data.passes:[],
      attendance:Array.isArray(data.attendance)?data.attendance:[]
    };
  }else{
    state={passes:[],attendance:[]};
    await setDoc(cloudRef(),{
      passes:[],
      attendance:[],
      updatedAt:new Date().toISOString()
    });
  }
  render();
  el("syncStatus").textContent="동기화됨";
}

async function save(){
  if(!currentUser){
    saveLocal();
    el("syncStatus").textContent="이 브라우저에만 저장됨 · 로그인하면 기기 간 동기화";
    return;
  }
  el("syncStatus").textContent="저장 중...";
  await setDoc(cloudRef(),{
    passes:state.passes,
    attendance:state.attendance,
    updatedAt:new Date().toISOString()
  });
  el("syncStatus").textContent="동기화됨";
}

function loadLocalIntoState(){
  var local=getLocalState();
  state.passes=local.passes;
  state.attendance=local.attendance;
}

function resetPassForm(){
  editingPassId=null;
  el("passName").value="";
  el("passPrice").value="";
  el("passStart").value="";
  el("passEnd").value="";
  el("passWeeklyMax").value=3;
  el("savePassBtn").textContent="등록 추가";
}

async function savePass(){
  var name=el("passName").value.trim() || ((state.passes.length+1)+"차 등록");
  var price=Number(el("passPrice").value)||0;
  var start=el("passStart").value;
  var end=el("passEnd").value;
  var weeklyMax=Math.max(1,Math.min(7,Number(el("passWeeklyMax").value)||3));

  if(!start||!end){alert("시작일과 종료일을 입력해 주세요.");return;}
  if(end<start){alert("종료일이 시작일보다 빠릅니다.");return;}

  if(editingPassId){
    var p=state.passes.find(function(x){return x.id===editingPassId;});
    if(!p)return;
    p.name=name;p.price=price;p.start=start;p.end=end;p.weeklyMax=weeklyMax;
  }else{
    state.passes.push({id:uid(),name:name,price:price,start:start,end:end,weeklyMax:weeklyMax});
  }
  state.passes.sort(function(a,b){return a.start.localeCompare(b.start);});
  await save();
  resetPassForm();
  render();
}

function editPass(id){
  var p=state.passes.find(function(x){return x.id===id;});
  if(!p)return;
  editingPassId=id;
  el("passName").value=p.name;
  el("passPrice").value=p.price;
  el("passStart").value=p.start;
  el("passEnd").value=p.end;
  el("passWeeklyMax").value=p.weeklyMax;
  el("savePassBtn").textContent="수정 저장";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deletePass(id){
  var used=state.attendance.some(function(a){return a.passId===id;});
  if(used && !confirm("이 등록에 연결된 출석 기록도 함께 삭제됩니다. 계속할까요?"))return;
  state.passes=state.passes.filter(function(p){return p.id!==id;});
  state.attendance=state.attendance.filter(function(a){return a.passId!==id;});
  await save();
  render();
}

function matchingPasses(date){
  return state.passes.filter(function(p){return date>=p.start && date<=p.end;});
}

function weeklyUsed(passId,date){
  var wk=mondayKey(date);
  return state.attendance.filter(function(a){
    return a.passId===passId && mondayKey(a.date)===wk;
  }).length;
}

async function addAttendance(){
  var date=el("attDate").value;
  if(!date){alert("날짜를 선택해 주세요.");return;}
  if(state.attendance.some(function(a){return a.date===date;})){
    alert("이미 등록된 출석 날짜입니다."); return;
  }

  var matches=matchingPasses(date);
  if(matches.length===0){
    alert("이 날짜가 포함되는 등록 기간이 없습니다."); return;
  }

  var pass=null;
  if(matches.length===1){
    pass=matches[0];
  }else{
    var names=matches.map(function(p,i){return (i+1)+". "+p.name+" ("+p.start+" ~ "+p.end+")";}).join("\n");
    var picked=prompt("등록 기간이 겹칩니다. 넣을 등록 번호를 입력해 주세요.\n\n"+names,"1");
    var idx=Number(picked)-1;
    if(!Number.isInteger(idx)||idx<0||idx>=matches.length)return;
    pass=matches[idx];
  }

  if(weeklyUsed(pass.id,date)>=pass.weeklyMax){
    alert("해당 등록의 주 최대 "+pass.weeklyMax+"회를 이미 사용했습니다."); return;
  }

  state.attendance.push({id:uid(),date:date,passId:pass.id});
  state.attendance.sort(function(a,b){return a.date.localeCompare(b.date);});
  await save();
  render();
}

async function deleteAttendance(id){
  state.attendance=state.attendance.filter(function(a){return a.id!==id;});
  await save();
  render();
}

function renderPasses(){
  var box=el("passList");
  if(state.passes.length===0){
    box.innerHTML='<div class="empty">아직 등록 이력이 없습니다.</div>'; return;
  }

  var html="";
  state.passes.forEach(function(p){
    var atts=state.attendance.filter(function(a){return a.passId===p.id;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    var count=atts.length;
    var unit=count?p.price/count:0;
    var latest=count?atts[atts.length-1].date:"-";

    html+='<div class="pass">';
    html+='<div class="pass-head"><div><div class="pass-title">'+escapeHtml(p.name)+'</div>';
    html+='<div class="pass-sub">'+p.start+' ~ '+p.end+' · 주 최대 '+p.weeklyMax+'회</div></div>';
    html+='<div class="small-actions"><button class="secondary edit-pass" data-id="'+p.id+'">수정</button><button class="delete del-pass" data-id="'+p.id+'">삭제</button></div></div>';
    html+='<div class="metrics">';
    html+='<div class="metric"><span>등록 금액</span><b>'+won(p.price)+'</b></div>';
    html+='<div class="metric"><span>실제 출석</span><b>'+count+'회</b></div>';
    html+='<div class="metric"><span>실제 회당 비용</span><b>'+(count?won(unit):"-")+'</b></div>';
    html+='<div class="metric"><span>최근 출석</span><b>'+latest+'</b></div>';
    html+='</div>';
    if(count){
      html+='<div class="note">출석일: '+atts.map(function(a){return a.date;}).join(", ")+'</div>';
    }
    html+='</div>';
  });

  box.innerHTML=html;
  box.querySelectorAll(".edit-pass").forEach(function(btn){
    btn.addEventListener("click",function(){editPass(this.getAttribute("data-id"));});
  });
  box.querySelectorAll(".del-pass").forEach(function(btn){
    btn.addEventListener("click",function(){deletePass(this.getAttribute("data-id"));});
  });
}

function renderAttendance(){
  var box=el("attendanceList");
  if(state.attendance.length===0){
    box.innerHTML='<div class="empty">아직 출석 기록이 없습니다.</div>'; return;
  }

  var sorted=state.attendance.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var html='<table><thead><tr><th>날짜</th><th>등록</th><th class="right">해당 등록 누적</th><th class="right">당시 회당 비용</th><th></th></tr></thead><tbody>';

  sorted.forEach(function(a){
    var p=state.passes.find(function(x){return x.id===a.passId;});
    if(!p)return;

    var before=state.attendance.filter(function(x){
      return x.passId===a.passId && x.date<=a.date;
    }).length;

    html+='<tr><td>'+a.date+'</td><td><span class="tag">'+escapeHtml(p.name)+'</span></td><td class="right">'+before+'회</td><td class="right">'+won(p.price/before)+'</td><td class="right"><button class="delete del-att" data-id="'+a.id+'">삭제</button></td></tr>';
  });

  html+='</tbody></table>';
  box.innerHTML=html;

  box.querySelectorAll(".del-att").forEach(function(btn){
    btn.addEventListener("click",function(){deleteAttendance(this.getAttribute("data-id"));});
  });
}

function render(){
  renderPasses();
  renderAttendance();
}

el("savePassBtn").addEventListener("click",savePass);
el("addAttBtn").addEventListener("click",addAttendance);

el("loginGoogle").addEventListener("click", async function(){
  try{
    await signInWithPopup(auth,new GoogleAuthProvider());
  }catch(err){
    alert("Google 로그인에 실패했습니다: "+(err?.message||err));
  }
});

el("logoutGoogle").addEventListener("click", async function(){
  await signOut(auth);
});

el("migrateLocal").addEventListener("click", async function(){
  if(!currentUser){
    alert("먼저 Google 로그인을 해주세요.");
    return;
  }

  var local=getLocalState();
  if(local.passes.length===0 && local.attendance.length===0){
    alert("이 브라우저에 이전할 기존 데이터가 없습니다.");
    return;
  }

  var msg=
    "이 브라우저의 기존 필라테스 데이터를 클라우드로 옮길까요?\n\n"+
    "등록: "+local.passes.length+"건\n"+
    "출석: "+local.attendance.length+"건\n\n"+
    "현재 클라우드 데이터는 이 내용으로 교체됩니다.";

  if(!confirm(msg))return;

  state=local;
  await save();
  render();
  alert("기존 데이터 이전이 완료되었습니다.");
});

el("attDate").value=todayString();
loadLocalIntoState();
render();

onAuthStateChanged(auth, async function(user){
  currentUser=user||null;

  if(currentUser){
    el("authStatus").textContent=(currentUser.email||"Google 계정")+"로 로그인됨";
    el("loginGoogle").style.display="none";
    el("logoutGoogle").style.display="";
    el("migrateLocal").disabled=false;
    try{
      await loadCloud();
    }catch(err){
      el("syncStatus").textContent="동기화 오류";
      alert("클라우드 데이터를 불러오지 못했습니다: "+(err?.message||err));
    }
  }else{
    el("authStatus").textContent="로그인하지 않음";
    el("loginGoogle").style.display="";
    el("logoutGoogle").style.display="none";
    el("migrateLocal").disabled=true;
    loadLocalIntoState();
    el("syncStatus").textContent="이 브라우저에만 저장됨 · 로그인하면 기기 간 동기화";
    render();
  }
});
</script>

</body>
</html>
